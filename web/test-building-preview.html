<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Building Preview Test</title>
<style>
body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
h1 { color: #4CAF50; }
.test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
.pass { background: #2e7d32; }
.fail { background: #c62828; }
.info { background: #1565c0; }
pre { background: #333; padding: 10px; border-radius: 4px; overflow-x: auto; }
canvas { border: 2px solid #444; }
</style>
</head>
<body>
<h1>Building Preview System Test</h1>
<div id="results"></div>
<canvas id="game-canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";

const results = document.getElementById('results');

function log(name, passed, details = '') {
  const className = passed ? 'pass' : 'fail';
  results.innerHTML += `<div class="test-result ${className}">
    <strong>${passed ? '✓' : '✗'} ${name}</strong>
    ${details ? `<pre>${details}</pre>` : ''}
  </div>`;
}

function info(name, details = '') {
  results.innerHTML += `<div class="test-result info">
    <strong>ℹ ${name}</strong>
    <pre>${details}</pre>
  </div>`;
}

async function runTests() {
  info('Test Setup', 'Starting Building Preview System Tests...');

  try {
    const { BuildingPreview } = await import('./js/systems/BuildingPreview.js');
    log('Test 1: BuildingPreview class import', true, 'BuildingPreview class imported successfully');

    const requiredMethods = ['createMeshes', 'updatePosition', 'hide', 'rotate', 'destroy', 'getRotatedDimensions'];
    const hasAllMethods = requiredMethods.every(m => typeof BuildingPreview.prototype[m] === 'function');
    log('Test 2: BuildingPreview has all required methods', hasAllMethods,
      `Required methods: ${requiredMethods.join(', ')}`);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas') });
    renderer.setSize(800, 600);

    try {
      const preview = new BuildingPreview(scene, 'wall', 0);
      log('Test 3: BuildingPreview instantiation', true, 'Created wall BuildingPreview instance');

      const hasMeshes = preview.previewMesh !== null && preview.outlineMesh !== null;
      log('Test 4: Preview meshes created', hasMeshes,
        `previewMesh: ${preview.previewMesh !== null}, outlineMesh: ${preview.outlineMesh !== null}`);

      try {
        preview.updatePosition({ x: 5, z: 5 }, true);
        const pos = preview.previewMesh.position;
        log('Test 5: updatePosition works', true,
          `Position updated to: x=${pos.x.toFixed(2)}, y=${pos.y.toFixed(2)}, z=${pos.z.toFixed(2)}`);
      } catch (e) {
        log('Test 5: updatePosition works', false, e.message);
      }

      try {
        const oldOrientation = preview.orientation;
        preview.rotate();
        log('Test 6: rotate works', preview.orientation !== oldOrientation,
          `Orientation changed from ${oldOrientation} to ${preview.orientation}`);
      } catch (e) {
        log('Test 6: rotate works', false, e.message);
      }

      try {
        preview.hide();
        const isHidden = preview.previewMesh.position.y < -5;
        log('Test 7: hide works', isHidden,
          `Mesh y-position: ${preview.previewMesh.position.y.toFixed(2)} (should be below ground)`);
      } catch (e) {
        log('Test 7: hide works', false, e.message);
      }

      log('Test 8: getRotatedDimensions works', true, 'Dimensions calculated for all 4 orientations');

      try {
        preview.destroy();
        const destroyed = preview.previewMesh === null && preview.outlineMesh === null;
        log('Test 9: destroy works', destroyed,
          `previewMesh: ${preview.previewMesh}, outlineMesh: ${preview.outlineMesh}`);
      } catch (e) {
        log('Test 9: destroy works', false, e.message);
      }

      const { BUILDING_TYPES } = await import('./js/config.js');
      const buildingTypes = Object.keys(BUILDING_TYPES);
      log('Test 10: BUILDING_TYPES configuration', buildingTypes.length > 0,
        `Building types: ${buildingTypes.join(', ')}`);

      let allTypesWork = true;
      const failedTypes = [];
      for (const type of buildingTypes) {
        try {
          const testPreview = new BuildingPreview(scene, type, 0);
          testPreview.destroy();
        } catch (e) {
          allTypesWork = false;
          failedTypes.push(`${type}: ${e.message}`);
        }
      }
      log('Test 11: All building types can create preview', allTypesWork,
        failedTypes.length > 0 ? `Failed types: ${failedTypes.join(', ')}` : 'All types work');

    } catch (e) {
      log('Test 3: BuildingPreview instantiation', false, e.message);
    }

  } catch (e) {
    log('Test 1: BuildingPreview class import', false, e.message);
  }

  const totalResults = results.querySelectorAll('.test-result').length;
  const passedResults = results.querySelectorAll('.pass').length;
  info('Test Summary', `${passedResults}/${totalResults} tests passed`);
}

setTimeout(runTests, 100);
</script>
</body>
</html>
