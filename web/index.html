<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier Colony - RimWorld 风格单场景 Demo</title>
    <!-- Tailwind + DaisyUI CDN (使用国内 BootCDN 加速) -->
    <link href="https://cdn.bootcdn.net/ajax/libs/daisyui/5.5.5/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.17/tailwind.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              game: {
                bg: '#0f141f',
                panel: 'rgba(23, 26, 33, 0.88)',
                border: 'rgba(132, 158, 210, 0.42)',
                'border-hover': 'rgba(121, 176, 255, 0.6)',
                text: '#dde8ff',
                'text-dim': '#b0bfd8',
                accent: {
                  DEFAULT: '#79b0ff',
                  hover: '#8fc0ff',
                  glow: 'rgba(121, 176, 255, 0.3)',
                },
                danger: '#e86a7c',
                success: '#78d17a',
                warning: '#f5a623',
              },
              wood: '#d4a574',
              ore: '#a8b5c4',
              berry: '#c06c84',
              food: '#f4a261',
            },
            backdropBlur: {
              xs: '2px',
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'slide-in': 'slideIn 0.3s ease-out',
              'fade-out': 'fadeOut 0.3s ease-in',
              'bounce-subtle': 'bounceSubtle 0.3s ease-out',
            },
            keyframes: {
              slideIn: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              fadeOut: {
                '0%': { transform: 'translateX(0)', opacity: '1' },
                '100%': { transform: 'translateX(100%)', opacity: '0' },
              },
              bounceSubtle: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-2px)' },
              },
            },
          },
        },
        daisyui: {
          themes: ['dark']
        },
      };
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tailwind.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <!-- Three.js import map (使用国内 BootCDN 加速) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.js",
          "three/addons/": "https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root" class="absolute inset-0 pointer-events-none"></div>

      <footer class="bottom-bar panel">
        <div class="mode-title">建造指令</div>
        <div class="button-grid">
          <button data-mode="inspect" class="active">检视</button>
          <button data-mode="build_house">建造房屋</button>
          <button data-mode="plant_berry">种植浆果</button>
          <button data-mode="harvest_berry">收获浆果</button>
          <button data-mode="mine_ore">开采矿石</button>
          <button data-mode="move_order">移动指令</button>
          <button data-mode="attack">徒手攻击</button>
        </div>
        <div class="tip" id="mode-tip"></div>
      </footer>

      <div class="minimap panel">
        <canvas id="minimap" width="180" height="180"></canvas>
      </div>
    </div>

    <script>
      // Wait for DOM to be fully loaded
      document.addEventListener('DOMContentLoaded', () => {
        import('./game.js').catch(err => {
          console.error('Failed to load game:', err);
        });
      });
    </script>
  </body>
</html>
